<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3F7360" />
    <meta name="description" content="SanfeFer — punto de venta" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SanfeFer</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar un destello de color.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('sanfefer-theme') || '{}').state;
          var mode = (saved && saved.mode) || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
