# Opcional: evita que la API gratuita de Render se duerma en horario de trabajo.
# Se activa al definir la variable del repositorio API_HEALTH_URL
# (Settings → Secrets and variables → Actions → Variables), por ejemplo
# https://sanfefer-api.onrender.com/api/health
# En repositorios privados consume minutos de GitHub Actions; ahí conviene UptimeRobot
# o cron-job.org (ver docs/DEPLOY.md).
name: Mantener despierta la API

on:
  schedule:
    # Cada 10 minutos de 15:00 a 00:59, hora de Guatemala (UTC−6).
    - cron: '*/10 21-23,0-6 * * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.API_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar a /api/health
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        # Si estaba dormida tarda hasta un minuto en responder.
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "$URL"
