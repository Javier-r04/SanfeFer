services:
  db:
    image: postgres:16-alpine
    container_name: sanfefer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanfefer
      POSTGRES_PASSWORD: sanfefer
      POSTGRES_DB: sanfefer
    ports:
      - '5432:5432'
    volumes:
      - sanfefer-db:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sanfefer -d sanfefer']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sanfefer-db:
